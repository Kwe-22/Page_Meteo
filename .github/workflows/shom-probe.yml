name: Essai SHOM (lecture seule)

# Se lance tout seul quand ce fichier ou le script d'essai est poussé sur la branche,
# ou à la main depuis l'onglet Actions (si le fichier est sur la branche par défaut).
on:
  workflow_dispatch:
  push:
    branches: [fix/meteo-marees-webcam]
    paths:
      - tools/shom-probe.mjs
      - .github/workflows/shom-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright (navigateur sans écran)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Lire les marées de Dahouet sur maree.shom.fr
        env:
          TZ: Europe/Paris
        run: |
          export DATE=$(date +%F)
          node tools/shom-probe.mjs
